loaders:
  - type: python
    search_path:
      - src
    packages:
      - lingodotdev
processors:
  - type: filter
    skip_empty_modules: true
  - type: smart
  - type: crossref
renderer:
  type: markdown
  filename: docs/api.md
  render_toc: true
  header_level_by_type:
    Module: 1
    Class: 2
    Method: 3
    Function: 3
    Variable: 3
